name: Android APK (debug)

# GitHub Actions 编译：解决 Muse VM 上 Gradle daemon 本地 TCP 被沙箱拦截的问题。
# 推送到 GitHub 后自动编，APK 不放 Actions Artifacts，改放到 GitHub Releases
#（用户 2026-11-03 明确要求：编译完成的 APK 放到 Releases）。
on:
  push:
    branches: [main]
    paths:
      - "app-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          build-root-directory: app-android
          arguments: :app:assembleDebug --stacktrace

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 小店AI助手 Debug build #${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: app-android/app/build/outputs/apk/debug/app-debug.apk
